<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanGlow Salon | Bookings</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="images/UGS Logo Design.jpg" alt="UrbanGlow Salon Logo" width="120">
            </a>
        </div>
        <h1>UrbanGlow Salon</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="pricing.html">Pricing</a>
            <a href="gallery.html">Gallery</a>
            <a href="bookings.html">Bookings</a>
            <a href="contact.html">Contact</a>
            <a href="location.html">Location</a>
        </nav>
    </header>

    <main>

        <h2>Book an Appointment</h2>

        <form action="#" method="post">

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" required>
            <br><br>

            <label for="service">Service:</label><br>

            <select id="service" name="service" required>
                <option value="">Select a service</option>
                <option value="hair">Hair Styling</option>
                <option value="beauty">Beauty Services</option>
                <option value="skincare">Skincare</option>
                <option value="grooming">Grooming</option>
            </select>

            <br><br>

            <label for="date">Appointment Date:</label><br>
            <input type="date" id="date" name="date" required>

            <br><br>

            <label for="message">Message:</label><br>
            <textarea id="message"
                      name="message"
                      rows="5"
                      cols="40"></textarea>

            <br><br>

            <button type="submit">
                Submit Booking
            </button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 UrbanGlow Salon. All Rights Reserved. st10509100</p>
    </footer>

</body>
</html>
